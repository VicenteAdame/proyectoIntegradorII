<div class="card mt-0 shadow">
    <div class="card-header bg-success text-white">
        <app-navegation-component></app-navegation-component>
        <h3 class="mb-0 text-start">Registro de Préstamo</h3>
    </div>
    <div class="card-body">
        <ul class="nav nav-tabs" id="prestamoTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="listado-tab" data-bs-toggle="tab" data-bs-target="#listado"
                    type="button" role="tab" aria-controls="listado" aria-selected="true">Listado</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="registrar-tab" data-bs-toggle="tab" data-bs-target="#registrar"
                    type="button" role="tab" aria-controls="registrar" aria-selected="false">Registrar</button>
            </li>
        </ul>

        <div class="tab-content border border-top-0 p-3" id="prestamoTabsContent">
            <!-- Pestaña de Listado -->
            <div class="tab-pane fade show active" id="listado" role="tabpanel" aria-labelledby="listado-tab">
                <div class="d-flex justify-content-between mb-3 align-items-end">
                    <div class="d-flex gap-2 align-items-center">
                        <label for="buscar" class="form-label mb-0 fw-bold">Fecha de Préstamo:</label>
                        <input type="date" class="form-control" id="buscar">
                        <button class="btn btn-outline-secondary" type="button">Buscar</button>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-primary" (click)="cancelarEdicion()">Nuevo</button>
                    </div>
                </div>

                <div class="table-responsive mb-3">
                    <table class="table table-bordered table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Id Préstamo</th>
                                <th>Matricula</th>
                                <th>No Serie</th>
                                <th>Nomina</th>
                                <th>Fecha</th>
                                <th>Cantidad</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Iterando sobre los préstamos -->
                            <tr *ngFor="let p of prestamos$ | async">
                                <td>{{ p.id }}</td>
                                <td>{{ p.matricula }}</td>
                                <td>{{ p.noSerie }}</td>
                                <td>{{ p.nomina }}</td>
                                <td>{{ p.fecha | date:'mediumDate' }}</td>
                                <td>{{ p.cantidad }}</td>
                                <td class="d-flex gap-1 justify-content-center">
                                    <button class="btn btn-sm btn-warning" (click)="editarPrestamo(p)" title="Editar">
                                        Editar
                                    </button>
                                    <button class="btn btn-sm btn-danger" (click)="eliminarPrestamo(p.id!)"
                                        title="Eliminar">
                                        Eliminar
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="d-flex justify-content-end align-items-center">
                    <span class="text-muted">Mostrando: {{ (prestamos$ | async)?.length || 0 }} préstamos</span>
                </div>
            </div>

            <!-- Pestaña de Registrar -->
            <div class="tab-pane fade" id="registrar" role="tabpanel" aria-labelledby="registrar-tab">
                <form class="row g-3" [formGroup]="prestamoForm" (ngSubmit)="guardarPrestamo()">
                    <div class="col-md-6">
                        <label for="idPrestamo" class="form-label fw-bold">1.- idPrestamo:</label>
                        <input type="text" class="form-control" id="idPrestamo" formControlName="idPrestamo">
                    </div>
                    
                    <div class="col-md-6">
                        <label for="matricula" class="form-label fw-bold">2.- Seleccione Matricula (Alumno):</label>
                        <select class="form-select" id="matricula" formControlName="matricula">
                            <option value="">Seleccione...</option>
                            <option *ngFor="let a of alumnos$ | async" [value]="a.matricula">
                                {{ a.matricula }} - {{ a.nombre }} {{ a.apellidoPaterno }}
                            </option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="noSerie" class="form-label fw-bold">3.- Seleccione No Serie (Herramienta):</label>
                        <select class="form-select" id="noSerie" formControlName="noSerie">
                            <option value="">Seleccione...</option>
                            <option *ngFor="let h of herramientas$ | async" [value]="h.noSerie">
                                {{ h.noSerie }} - {{ h.nombre }} (Stock: {{ h.cantidad }})
                            </option>
                        </select>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="nomina" class="form-label fw-bold">4.- Seleccione Nomina (Empleado):</label>
                        <select class="form-select" id="nomina" formControlName="nomina">
                            <option value="">Seleccione...</option>
                            <option *ngFor="let e of empleados$ | async" [value]="e.nomina">
                                {{ e.nomina }} - {{ e.nombre }}
                            </option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="cantidad" class="form-label fw-bold">5.- Cantidad Prestada:</label>
                        <input type="number" class="form-control" id="cantidad" formControlName="cantidad">
                    </div>

                    <div class="col-12 text-center mt-4">
                        <button type="submit" class="btn btn-primary px-4 me-3" [disabled]="prestamoForm.invalid">
                            {{ isEditing ? 'Actualizar' : 'Guardar' }}
                        </button>
                        <button type="button" class="btn btn-secondary px-4"
                            (click)="cancelarEdicion()">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
