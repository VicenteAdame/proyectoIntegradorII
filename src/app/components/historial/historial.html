<div class="card mt-0 shadow">
    <div class="card-header bg-success text-white">
        <app-navegation-component></app-navegation-component>
        <h3 class="mb-0 text-start">Registro de Historial</h3>
    </div>
    <div class="card-body">
        <ul class="nav nav-tabs" id="historialTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="listado-tab" data-bs-toggle="tab" data-bs-target="#listado"
                    type="button" role="tab" aria-controls="listado" aria-selected="true">Listado</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="registrar-tab" data-bs-toggle="tab" data-bs-target="#registrar"
                    type="button" role="tab" aria-controls="registrar" aria-selected="false">Registrar</button>
            </li>
        </ul>

        <div class="tab-content border border-top-0 p-3" id="historialTabsContent">
            <!-- Pestaña de Listado -->
            <div class="tab-pane fade show active" id="listado" role="tabpanel" aria-labelledby="listado-tab">
                <div class="d-flex justify-content-between mb-3 align-items-end">
                    <div class="d-flex gap-2 align-items-center">
                        <label for="buscar" class="form-label mb-0 fw-bold">Fecha de Devolución:</label>
                        <input type="date" class="form-control" id="buscar">
                        <button class="btn btn-outline-secondary" type="button">Buscar</button>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-primary" (click)="cancelarEdicion()">Nuevo</button>
                    </div>
                </div>

                <div class="table-responsive mb-3">
                    <table class="table table-bordered table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Id Historial</th>
                                <th>Id Préstamo</th>
                                <th>Fecha Devolución</th>
                                <th>Cantidad Devuelta</th>
                                <th>Observaciones</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Iterando registros de historial -->
                            <tr *ngFor="let h of historiales$ | async">
                                <td>{{ h.id }}</td>
                                <td>{{ h.idPrestamo }}</td>
                                <td>{{ h.fechaDevolucion | date:'mediumDate' }}</td>
                                <td>{{ h.cantidadDevuelta }}</td>
                                <td>{{ h.observaciones }}</td>
                                <td class="d-flex gap-1 justify-content-center">
                                    <button class="btn btn-sm btn-warning" (click)="editarHistorial(h)" title="Editar">
                                        Editar
                                    </button>
                                    <button class="btn btn-sm btn-danger" (click)="eliminarHistorial(h.id!)"
                                        title="Eliminar">
                                        Eliminar
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="d-flex justify-content-end align-items-center">
                    <span class="text-muted">Mostrando: {{ (historiales$ | async)?.length || 0 }} registros</span>
                </div>
            </div>

            <!-- Pestaña de Registrar -->
            <div class="tab-pane fade" id="registrar" role="tabpanel" aria-labelledby="registrar-tab">
                <form class="row g-3" [formGroup]="historialForm" (ngSubmit)="guardarHistorial()">
                    <div class="col-md-6">
                        <label for="idHistorial" class="form-label fw-bold">1.- idHistorial:</label>
                        <input type="text" class="form-control" id="idHistorial" formControlName="idHistorial">
                    </div>
                    
                    <div class="col-md-6">
                        <label for="idPrestamo" class="form-label fw-bold">2.- Seleccione idPrestamo:</label>
                        <select class="form-select" id="idPrestamo" formControlName="idPrestamo">
                            <option value="">Seleccione un préstamo pendiente...</option>
                            <!-- Mostrar los préstamos activos -->
                            <option *ngFor="let p of prestamos$ | async" [value]="p.id">
                                Préstamo #{{ p.id }} - {{ p.matricula }}
                            </option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="cantidad" class="form-label fw-bold">3.- Cantidad Devuelta:</label>
                        <input type="number" class="form-control" id="cantidad" formControlName="cantidadDevuelta">
                    </div>
                    
                    <div class="col-md-6">
                        <label for="observaciones" class="form-label fw-bold">4.- Observaciones:</label>
                        <textarea class="form-control" id="observaciones" rows="3" formControlName="observaciones"></textarea>
                    </div>

                    <div class="col-12 text-center mt-4">
                        <button type="submit" class="btn btn-primary px-4 me-3" [disabled]="historialForm.invalid">
                            {{ isEditing ? 'Actualizar' : 'Guardar' }}
                        </button>
                        <button type="button" class="btn btn-secondary px-4"
                            (click)="cancelarEdicion()">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
