<div class="card mt-0 shadow">
  <div class="card-header bg-success text-white">
    <app-navegation-component></app-navegation-component>
    <h3 class="mb-0 text-start">Registro de Alumno</h3>
  </div>

  <div class="card-body">
    <ul class="nav nav-tabs" id="alumnoTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="listado-tab" data-bs-toggle="tab" data-bs-target="#listado" type="button" role="tab" aria-controls="listado" aria-selected="true">Listado</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="registrar-tab" data-bs-toggle="tab" data-bs-target="#registrar" type="button" role="tab" aria-controls="registrar" aria-selected="false">Registrar</button>
      </li>
    </ul>
    
    <div class="tab-content border border-top-0 p-3" id="alumnoTabsContent">
      <!-- Pestaña de Listado -->
      <div class="tab-pane fade show active" id="listado" role="tabpanel" aria-labelledby="listado-tab">
        <div class="d-flex justify-content-between mb-3 align-items-end">
          <div class="d-flex gap-2 align-items-center">
            <label for="buscar" class="form-label mb-0 fw-bold">Nombre:</label>
            <input type="text" class="form-control" id="buscar" placeholder="Buscar alumno...">
            <button class="btn btn-outline-secondary" type="button">Buscar</button>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-primary" (click)="cancelarEdicion()">Nuevo</button>
          </div>
        </div>

        <div class="table-responsive mb-3">
          <table class="table table-bordered table-hover">
            <thead class="table-light">
              <tr>
                <th>Matricula</th>
                <th>Nombre</th>
                <th>A. Paterno</th>
                <th>A. Materno</th>
                <th>Carrera</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              <!-- Iterando alumnos desde Firebase -->
              <tr *ngFor="let a of alumnos$ | async">
                <td>{{ a.matricula }}</td>
                <td>{{ a.nombre }}</td>
                <td>{{ a.apellidoPaterno }}</td>
                <td>{{ a.apellidoMaterno }}</td>
                <td>{{ a.carrera }}</td>
                <td>
                  <span class="badge" [ngClass]="a.estado ? 'bg-success' : 'bg-secondary'">
                    {{ a.estado ? 'Activo' : 'Inactivo' }}
                  </span>
                </td>
                <td class="d-flex gap-1 justify-content-center">
                  <button class="btn btn-sm btn-warning" (click)="editarAlumno(a)" title="Editar">
                      Editar
                  </button>
                  <button class="btn btn-sm" [ngClass]="a.estado ? 'btn-secondary' : 'btn-success'"
                      (click)="toggleEstado(a)" title="Cambiar Estado">
                      {{ a.estado ? 'Desactivar' : 'Activar' }}
                  </button>
                  <button class="btn btn-sm btn-danger" (click)="eliminarAlumno(a.id!)"
                      title="Eliminar">
                      Eliminar
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="d-flex justify-content-end align-items-center">
          <span class="text-muted">Mostrando: {{ (alumnos$ | async)?.length || 0 }} alumnos</span>
        </div>
      </div>

      <!-- Pestaña de Registrar -->
      <div class="tab-pane fade" id="registrar" role="tabpanel" aria-labelledby="registrar-tab">
        <form class="row g-3" [formGroup]="alumnoForm" (ngSubmit)="guardarAlumno()">
          <div class="col-md-6">
            <label for="matricula" class="form-label fw-bold">1.- Ingrese Matricula:</label>
            <input type="text" class="form-control" id="matricula" formControlName="matricula">
          </div>
          <div class="col-md-6">
            <label for="nombre" class="form-label fw-bold">2.- Ingrese Nombre:</label>
            <input type="text" class="form-control" id="nombre" formControlName="nombre">
          </div>
          
          <div class="col-md-6">
            <label for="apellidoPaterno" class="form-label fw-bold">3.- Ingrese Apellido Paterno:</label>
            <input type="text" class="form-control" id="apellidoPaterno" formControlName="apellidoPaterno">
          </div>
          <div class="col-md-6">
            <label for="apellidoMaterno" class="form-label fw-bold">4.- Ingrese Apellido Materno:</label>
            <input type="text" class="form-control" id="apellidoMaterno" formControlName="apellidoMaterno">
          </div>

          <div class="col-md-6">
            <label for="carrera" class="form-label fw-bold">5.- Ingrese Carrera:</label>
            <input type="text" class="form-control" id="carrera" formControlName="carrera">
          </div>
          
          <div class="col-md-6 d-flex align-items-center mt-5">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="estado" formControlName="estado">
                <label class="form-check-label fw-bold" for="estado">
                    Alumno Activo
                </label>
            </div>
          </div>

          <div class="col-12 text-center mt-4">
            <button type="submit" class="btn btn-primary px-4 me-3" [disabled]="alumnoForm.invalid">
                {{ isEditing ? 'Actualizar' : 'Guardar' }}
            </button>
            <button type="button" class="btn btn-secondary px-4" (click)="cancelarEdicion()">Cancelar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
