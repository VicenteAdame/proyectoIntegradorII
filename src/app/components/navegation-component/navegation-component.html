<div class="collapse navbar-collapse" id="navbarAdmin">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" [routerLink]="rol === 'admin' ? '/admin' : '/empleado'">Inicio</a>
          </li>
          <ng-container *ngIf="rol === 'admin'">
            <li class="nav-item">
              <a class="nav-link active" routerLink="/admin/empleado-registro">Empleados</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" routerLink="/admin/alumno-registro">Alumnos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" routerLink="/admin/herramienta-registro">Herramientas</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" routerLink="/admin/prestamo-registro">Préstamos</a>
            </li>
          </ng-container>
          <ng-container *ngIf="rol === 'empleado'">
            <li class="nav-item">
              <a class="nav-link active" routerLink="/empleado/prestamo-registro">Préstamos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" routerLink="/empleado/tah">Devoluciones</a>
            </li>
          </ng-container>
        </ul>
        <span class="navbar-text me-3 d-none d-sm-inline">
          {{ rol === 'admin' ? 'Administrador' : 'Empleado' }}
        </span>
        <a class="btn btn-outline-light btn-sm" routerLink="/login" (click)="onLogout()">
          Cerrar sesión
        </a>
      </div>
